apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: demo
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: frontend
        image: myregistry.com/frontend:latest
        ports:
        - containerPort: 8501
